[tool.poetry]
name = "dl_streamlit_pubquiz"
version = "0.0.0"
description = ""
authors = ["Thijmen van Es <thijmen.van.es@pon.com>"]
package-mode = false

[[tool.poetry.source]]
name = "datalab-shared-python-repo-prod"
url = "https://datalab-shared-primary-domain-prod-590183924804.d.codeartifact.eu-west-1.amazonaws.com/pypi/datalab-shared-python-repo-prod/simple/"
priority = "primary"

[[tool.poetry.source]]
name = "PyPI"
priority = "supplemental"

[tool.poetry.dependencies]
python = ">=3.14.5,<3.15"
python-dotenv = "1.1.0"
pydantic-settings = "2.9.1"
pondl = {version = "1.3.4", extras = ["parameters"]}
streamlit = "^1.59.2"

[tool.poetry.group.dev.dependencies]
nox = "2025.5.1"
flake8 = "7.2.0"
flake8-bandit = "4.1.1"
flake8-black = "0.3.6"
nox-poetry = "1.2.0"
pytest-cov = "6.2.1"
mccabe = "0.7.0"
pondl = {version = "1.3.4", extras = ["cli"]}

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = true
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
fail-under = 100
exclude = ["**/databases/**.py"]
ignore-regex = []
verbose = 0 # possible values: 0 (minimal output), 1 (-v), 2 (-vv)
quiet = false
whitelist-regex = []
color = true
omit-covered-files = false
generate-badge = "."
badge-format = "svg"
